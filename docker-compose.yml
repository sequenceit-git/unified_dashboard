services:
  mongo:
    image: mongo:7.0
    container_name: unified-dashboard-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=unified_dashboard
    volumes:
      - mongodb-data:/data/db
    ports:
      # Expose to localhost only on server host (secure, not exposed to public WAN)
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unified-dashboard-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongo:27017/unified_dashboard}
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - internal-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}"
      # Route /api and /uploads to the backend service (higher priority)
      - "traefik.http.routers.dashboard-backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.dashboard-backend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.dashboard-backend.priority=20"
      - "traefik.http.routers.dashboard-backend.tls=true"
      - "traefik.http.routers.dashboard-backend.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.dashboard-backend.loadbalancer.server.port=5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unified-dashboard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}"
      # Route all other frontend requests to nginx (lower priority)
      - "traefik.http.routers.dashboard-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.dashboard-frontend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.dashboard-frontend.priority=10"
      - "traefik.http.routers.dashboard-frontend.tls=true"
      - "traefik.http.routers.dashboard-frontend.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.dashboard-frontend.loadbalancer.server.port=80"

volumes:
  backend-uploads:
  mongodb-data:

networks:
  internal-net:
    driver: bridge
  traefik-net:
    name: ${TRAEFIK_NETWORK:-traefik-public}
    external: true
