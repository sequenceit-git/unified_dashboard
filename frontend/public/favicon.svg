<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="ecomWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="ecomGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern App Icon Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#ecomBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Pilot Supersonic Delta Wing / Navigation Emblem -->
  <g filter="url(#shadow)">
    <!-- Main Aerodynamic Pilot Wings -->
    <path d="M32 11L51 46.5L32 39.5L13 46.5L32 11Z" fill="url(#ecomWing)"/>
    
    <!-- Inner Cockpit / Speed Core -->
    <path d="M32 18.5L44.5 42L32 36.5L19.5 42L32 18.5Z" fill="url(#ecomGlow)"/>
    
    <!-- Forward Vector Navigation Line -->
    <path d="M32 15L32 36" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Pilot Beacon / Spark -->
    <circle cx="32" cy="27" r="3.2" fill="#FFFFFF"/>
    <circle cx="32" cy="27" r="1.6" fill="#0284C7"/>
  </g>
</svg>